# Amazon ML Challenge - Default Training Configuration
# All hyperparameters in one place. No magic numbers in code.

seed: 42
n_folds: 5

# Feature engineering
features:
  tfidf_max_features: 15000
  tfidf_ngram_range: [1, 2]
  tfidf_min_df: 3

# Target transformation
target:
  transform: log  # log(price) — minimizing MAE on log ≈ minimizing SMAPE
  clip_min: 0.01

# LightGBM parameters
lgbm:
  objective: huber
  metric: mae
  boosting_type: gbdt
  n_estimators: 2000
  learning_rate: 0.05
  num_leaves: 127
  min_child_samples: 50
  feature_fraction: 0.7
  bagging_fraction: 0.8
  bagging_freq: 5
  reg_alpha: 0.1
  reg_lambda: 1.0
  verbose: -1
  n_jobs: -1
  random_state: 42
  # Early stopping
  early_stopping_rounds: 100

# Paths (relative to project root)
paths:
  dataset_dir: dataset
  model_dir: models
  output_file: dataset/test_out.csv
